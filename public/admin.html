<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Ajith Ticket Verification</title><link rel="stylesheet" href="style.css"></head>
<body><main class="card wide"><div class="brand">Ajith <span>Admin Dashboard</span></div>
<section id="login"><h1>Administrator sign in</h1><label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">Sign in</button><p id="loginMsg" class="message"></p></section>
<section id="dashboard" class="hidden"><h1>Visitor codes</h1><p class="muted">Codes generated by visitors appear here automatically. Codes expire after 24 hours.</p>
<div class="verify"><input id="verifyCode" inputmode="numeric" maxlength="6" placeholder="Enter visitor code"><button id="verifyBtn">Verify code</button></div><p id="verifyMsg" class="message" aria-live="polite"></p>
<div class="tablewrap"><table><thead><tr><th>Code</th><th>Created</th><th>Expires</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="row"><button id="refresh" class="light">Refresh list</button><button id="logout" class="danger">Sign out</button></div></section>
<a class="adminlink" href="/">Visitor page</a><p class="foot">Keep this dashboard private. Use HTTPS when hosting publicly.</p></main><script src="admin.js"></script></body></html>
